name: CI

on:
  push:
    branches:
      - mima
      - mima-release-*
      - release-*
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_SIGNING_KEY }}
  COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
  # BuildPulse is Crossplane upstream's flaky-test dashboard; the mimacom fork has
  # no BUILDPULSE_* secrets. Surfaced here so the e2e "Publish E2E Test Flakes"
  # step can guard on it (buildpulse-action v3 hard-fails on missing auth).
  BUILDPULSE_ACCESS_KEY_ID: ${{ secrets.BUILDPULSE_ACCESS_KEY_ID }}

jobs:
  check-diff:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Verify Generated Code
        run: nix build .#checks.x86_64-linux.generate --print-build-logs

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Lint
        run: nix build .#checks.x86_64-linux.go-lint .#checks.x86_64-linux.helm-lint --print-build-logs

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Nix Environment
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run Unit Tests
        run: nix build .#checks.x86_64-linux.test --print-build-logs

      - name: Publish Unit Test Coverage
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          flags: unittests
          file: result/coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

  # E2E tests run outside the Nix sandbox (needs Docker)
  e2e-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-area:
          - apiextensions
          - apiextensions-legacy
          - pkg
          - protection
          - lifecycle

        test-suite:
          - base

        include:
          - test-area: apiextensions
            test-suite: function-response-cache
          - test-area: apiextensions-legacy
            test-suite: function-response-cache
          - test-area: pkg
            test-suite: package-dependency-updates
          - test-area: pkg
            test-suite: package-signature-verification
          - test-area: ops
            test-suite: ops
          - test-area: mrap
            test-suite: mrap

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set CROSSPLANE_PRIOR_VERSION
        if: startsWith(github.ref, 'refs/heads/release-') || startsWith(github.base_ref, 'release-')
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/release-* ]]; then
            VERSION=${GITHUB_REF#refs/heads/release-}
          elif [[ "${GITHUB_BASE_REF}" == release-* ]]; then
            VERSION=${GITHUB_BASE_REF#release-}
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [[ "$MINOR" -gt 0 ]]; then
            MINOR=$((MINOR - 1))
          else
            echo "Error: Minor version cannot be decremented below 0"
            exit 1
          fi
          echo "CROSSPLANE_PRIOR_VERSION=$MAJOR.$MINOR" >> "$GITHUB_ENV"

      - name: Run E2E Tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: |
            nix run .#e2e -- \
              -test.failfast \
              -fail-fast \
              -prior-crossplane-version=${CROSSPLANE_PRIOR_VERSION} \
              --test-suite ${{ matrix.test-suite }} \
              -labels area=${{ matrix.test-area }}

      - name: Publish E2E Test Flakes
        # Skip on the fork when BuildPulse creds are absent (see workflow env above).
        if: ${{ !cancelled() && env.BUILDPULSE_ACCESS_KEY_ID != '' }}
        uses: buildpulse/buildpulse-action@76dbedc6585e8731b40a19da1ebc3f6609dbbb83 # v3
        with:
          account: 45158470
          repository: 147886080
          key: ${{ secrets.BUILDPULSE_ACCESS_KEY_ID }}
          secret: ${{ secrets.BUILDPULSE_SECRET_ACCESS_KEY }}
          path: ${{ runner.temp }}/e2e-tests.xml

      - name: Upload E2E Test Artifacts
        if: '!cancelled()'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-tests-${{ matrix.test-area }}-${{ matrix.test-suite }}
          path: ${{ runner.temp }}/e2e-tests.xml

  # Build all artifacts (binaries, images, Helm chart)
  build-artifacts:
    permissions:
      contents: write  # for creating the GitHub Release (cosign.pub)
      packages: write  # for pushing to ghcr.io
    runs-on: ubuntu-24.04

    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: false
          large-packages: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Set buildVersion in flake.nix. The version is an input to the build.
      # Pure (sandboxed, reproducible) Nix build inputs can only come from git
      # tracked files, so we set it in flake.nix before building.
      #
      # VERSION must ALWAYS be a valid semver — the Nix Helm-chart build stamps it
      # into Chart.yaml and rejects anything non-semver ("invalid semantic
      # version"). On a v* tag this is the tag (e.g. v2.3.4). Off-tag (a mima /
      # branch build with no reachable v* tag) `git describe --always` would fall
      # back to a bare commit SHA, which is not semver; use a Go-style
      # pseudo-version instead: v0.0.0-<utc-timestamp>-<short-sha>.
      - name: Set Version
        run: |
          set -euo pipefail
          if git describe --tags --exact-match --match 'v[0-9]*' >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match --match 'v[0-9]*')"
          elif VERSION="$(git describe --tags --match 'v[0-9]*' 2>/dev/null)"; then
            VERSION="$(printf '%s' "$VERSION" | sed 's/-/./2g')"
          else
            VERSION="v0.0.0-$(git show -s --format=%cd --date=format:'%Y%m%d%H%M%S' HEAD)-$(git rev-parse --short=12 HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s|buildVersion = null;|buildVersion = \"$VERSION\";|" flake.nix

      - name: Build Artifacts
        run: nix build --option warn-dirty false --print-build-logs

      - name: Validate Artifacts
        run: |
          for f in $(find result/bin/ -type f -not -name '*.sha256'); do
            want=$(sha256sum "${f}" | head -c 64)
            got=$(cat "${f}.sha256")
            if [[ "${want}" != "${got}" ]]; then
              echo "File ${f} has incorrect checksum; want ${want}, got ${got}"
              exit 1
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: output
          path: result/**

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Images to GitHub Container Registry
        if: github.ref == 'refs/heads/mima' || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')
        # Retry to survive transient GHCR blips (e.g. `Get https://ghcr.io/v2/: EOF`).
        # push-images is idempotent — already-pushed layers report "Layer already exists".
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if nix run --option warn-dirty false .#push-images -- ghcr.io/${{ github.repository_owner }}/crossplane; then
              exit 0
            fi
            echo "::warning::push-images attempt ${attempt}/3 failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::push-images failed after 3 attempts"
          exit 1

      # Push the Helm chart and capture the EXACT ref+digest helm published, so
      # the signing step below signs precisely what was pushed. helm derives the
      # tag from the chart's own Chart.yaml version, which is not guaranteed to
      # equal ${VERSION}; signing by digest avoids that drift entirely.
      - name: Push Helm Chart to GitHub Container Registry
        id: push_chart
        if: github.ref == 'refs/heads/mima' || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Retry to survive transient GHCR blips; re-pushing the same chart is safe.
          out=""
          for attempt in 1 2 3; do
            if out="$(nix shell nixpkgs#kubernetes-helm -c helm push result/charts/crossplane-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)"; then
              break
            fi
            echo "::warning::helm push attempt ${attempt}/3 failed; retrying in 15s..."
            out=""
            sleep 15
          done
          if [ -z "$out" ]; then echo "::error::helm push failed after 3 attempts"; exit 1; fi
          echo "$out"
          pushed="$(printf '%s\n' "$out" | sed -n 's/^Pushed: //p' | head -1)"
          digest="$(printf '%s\n' "$out" | sed -n 's/^Digest: //p' | head -1)"
          if [ -z "$pushed" ] || [ -z "$digest" ]; then
            echo "::error::could not parse helm push output for pushed ref/digest"; exit 1
          fi
          chart_repo="${pushed%:*}"
          echo "chart_ref=${chart_repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Chart pushed: ${pushed} (${digest})"

      - name: Install Cosign
        if: github.ref == 'refs/heads/mima' || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign Docker Image
        if: github.ref == 'refs/heads/mima' || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --yes \
            ghcr.io/${{ github.repository_owner }}/crossplane:${{ env.VERSION }}

      - name: Sign Helm Chart
        if: github.ref == 'refs/heads/mima' || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CHART_REF: ${{ steps.push_chart.outputs.chart_ref }}
        run: |
          cosign sign \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --yes \
            "${CHART_REF}"

  # Fuzz testing (unchanged from original)
  fuzz-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: "crossplane"
          language: go

      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        with:
          oss-fuzz-project-name: "crossplane"
          fuzz-seconds: 300
          language: go

      - name: Upload Crash
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts

  # Protobuf schema linting (unchanged from original)
  protobuf-schemas:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint Protocol Buffers
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          pr_comment: false
          push: false